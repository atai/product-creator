packages:
  - apps/*
  - packages/*
  - design-system

# pnpm >= 11: packages allowed to run install scripts
allowBuilds:
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  electron: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Squirrel.Windows helper of electron-builder; not used (NSIS target)
  electron-winstaller: false
