# Release (PRODUCTCREATOR-21): on a v* tag build installers for macOS (signed + notarized), Windows
# (unsigned by decision, no code-signing certificate) and Linux and
# publish them with the electron-updater feeds (latest*.yml) to a GitHub Release.
# Mirrors the proven Consolieri release workflow (atai/consolieri-desktop). Signing is optional:
# without secrets the build falls back to unsigned and the run shows warnings listing what is missing
# (set the repository variable PC_REQUIRE_SIGNING=true to fail instead). See Dev Docs → Releases.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag like v0.2.0, got '$TAG'"
            exit 1
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.name }}
      - name: Tag matches apps/desktop/package.json version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "v${VERSION}" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match apps/desktop/package.json version ${VERSION} (electron-updater feeds use the package version)"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifacts: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*-mac-*.zip
              apps/desktop/dist/*-mac-*.zip.blockmap
              apps/desktop/dist/latest-mac.yml
          - os: windows-latest
            target: win
            artifacts: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.exe.blockmap
              apps/desktop/dist/*-win-*.zip
              apps/desktop/dist/latest.yml
          - os: ubuntu-latest
            target: linux
            artifacts: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.tar.gz
              apps/desktop/dist/latest-linux*.yml
    env:
      PC_REQUIRE_SIGNING: ${{ vars.PC_REQUIRE_SIGNING }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # notarytool --key needs a file path; the secret holds base64 (or PEM) of the .p8.
      # API key is preferred; Apple ID is used only when the API key set is incomplete (as in Consolieri).
      - name: Prepare macOS signing and notarization credentials
        if: matrix.target == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${MAC_CSC_LINK:-}" && -n "${MAC_CSC_KEY_PASSWORD:-}" ]]; then
            {
              echo "CSC_LINK<<EOF"
              echo "${MAC_CSC_LINK}"
              echo "EOF"
              echo "CSC_KEY_PASSWORD<<EOF"
              echo "${MAC_CSC_KEY_PASSWORD}"
              echo "EOF"
            } >> "${GITHUB_ENV}"
            echo "Signing: Developer ID certificate from MAC_CSC_LINK"
          else
            # scripts/dist.mjs finds no identity on the runner and builds unsigned (or fails with PC_REQUIRE_SIGNING)
            echo "::warning::MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD not set: the macOS build will be unsigned and not notarized"
          fi
          if [[ -n "${APPLE_API_KEY_SECRET:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER:-}" ]]; then
            KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            if [[ "${APPLE_API_KEY_SECRET}" == *"BEGIN PRIVATE KEY"* ]]; then
              printf '%s\n' "${APPLE_API_KEY_SECRET}" > "${KEY_PATH}"
            else
              printf '%s' "${APPLE_API_KEY_SECRET}" | base64 --decode > "${KEY_PATH}"
            fi
            chmod 600 "${KEY_PATH}"
            {
              echo "APPLE_API_KEY=${KEY_PATH}"
              echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            } >> "${GITHUB_ENV}"
            echo "Notarization strategy: App Store Connect API key"
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            {
              echo "APPLE_ID<<EOF"
              echo "${APPLE_ID}"
              echo "EOF"
              echo "APPLE_APP_SPECIFIC_PASSWORD<<EOF"
              echo "${APPLE_APP_SPECIFIC_PASSWORD}"
              echo "EOF"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            } >> "${GITHUB_ENV}"
            echo "Notarization strategy: Apple ID + app-specific password"
          else
            echo "::warning::Notarization secrets incomplete: set APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER (preferred) or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID"
          fi

      - name: Build installers
        env:
          # Windows stays unsigned by decision; WIN_CSC_* is only passed through in case a cert is ever added
          WIN_CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: pnpm desktop:dist

      - name: Verify macOS signature and notarization
        if: matrix.target == 'mac'
        run: |
          APP="$(ls -d apps/desktop/dist/mac*/*.app | head -1)"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|flags' || true
          spctl -a -vvv -t exec "$APP" || echo "::warning::Gatekeeper does not accept the app (unsigned or not notarized)"
          xcrun stapler validate "$APP" || echo "::warning::No notarization ticket stapled to the app"
          for DMG in apps/desktop/dist/*.dmg; do
            spctl -a -vv -t install "$DMG" || echo "::warning::Gatekeeper does not accept $DMG"
            xcrun stapler validate "$DMG" || echo "::warning::No notarization ticket stapled to $DMG"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.target }}
          if-no-files-found: error
          path: ${{ matrix.artifacts }}

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true
      - run: ls -la dist-artifacts
      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Product Creator ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          body: |
            **Install:** macOS — `.dmg` (Apple silicon, signed and notarized); Windows — `.exe` installer; Linux — `.AppImage`.

            **Windows builds are not code-signed.** SmartScreen shows *Windows protected your PC* on the first start: click **More info → Run anyway**.
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.dmg
            dist-artifacts/*.zip
            dist-artifacts/*.zip.blockmap
            dist-artifacts/*.exe
            dist-artifacts/*.exe.blockmap
            dist-artifacts/*.AppImage
            dist-artifacts/*.tar.gz
            dist-artifacts/latest*.yml
          token: ${{ secrets.GITHUB_TOKEN }}
