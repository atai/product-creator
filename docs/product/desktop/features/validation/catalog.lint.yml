id: validation.catalog.lint
name: Lint the catalog from a terminal and CI
bounded_context: validation
entity: catalog
action: lint
owner: atai
lifecycle: implemented
tags: []
emits: []
consumes: []
apis: []
description: '`product-creator lint` validates the catalogs of a project; exit code 1 on errors. CI runs it on this repo.'
source_file: main/cli.ts
calls:
  - validation.model.validate
actors:
  - ci
  - developer
requirements:
  - id: R1
    text: Exit code is 1 when there are errors
