id: catalog.graph.show
name: Show the event graph
bounded_context: catalog
entity: graph
action: show
owner: atai
lifecycle: implemented
tags: []
emits: []
consumes: []
apis: []
description: 'Features and the links between them: calls, consecutive workflow steps and events, coloured by lifecycle.'
source_file: renderer/src/pages/graph.tsx
objects:
  - id: feature
    access: read
tickets:
  - PRODUCTCREATOR-7
  - PRODUCTCREATOR-35
screens:
  - id: S1
    title: 'Feature graph: calls, workflow steps and events'
    path: /graph
    wait: canvas
requirements:
  - id: R1
    text: Calls, workflow steps and events are drawn as arrows of their own style, with a legend
  - id: R2
    text: A node is as large as its name and no two nodes overlap
  - id: R3
    text: A labelled arrow is long enough for its label plus a margin at both ends
acceptance:
  - id: A1
    covers:
      - R1
    text: /api/graph returns calls, workflow and event edges between the shown features
    verify: pnpm --filter @pc/core test features
  - id: A2
    covers:
      - R2
      - R3
    text: Every name is shown in full and labelled arrows show their start and head (screenshot catalog.graph.show S1)
    verify: pnpm catalog:spec
i18n:
  ru:
    name: Граф событий
    description: 'Фичи и связи между ними: вызовы, соседние шаги процессов и события, цвет — по статусу.'
    requirements:
      R1:
        text: Вызовы, шаги процессов и события рисуются стрелками своего стиля, есть легенда
      R2:
        text: Узел по размеру вмещает своё название, узлы не перекрываются
      R3:
        text: Стрелка с подписью длиннее подписи на отступ с обеих сторон
    acceptance:
      A1:
        text: /api/graph возвращает связи вызовов, процессов и событий между показанными фичами
      A2:
        text: Каждое название видно целиком, у подписанных стрелок видны начало и наконечник (скриншот catalog.graph.show S1)
    screens:
      S1:
        title: 'Граф фич: вызовы, шаги процессов и события'
