id: catalog.problems.show
name: Show the problems of the catalog
bounded_context: catalog
entity: problems
action: show
owner: atai
lifecycle: implemented
tags: []
emits: []
consumes: []
apis: []
description: The Problems page lists validation errors and warnings with links to the entries.
source_file: renderer/src/pages/problems.tsx
calls:
  - validation.model.validate
objects:
  - id: validation_issue
    access: read
actors:
  - product_owner
requirements:
  - id: R1
    text: Every issue shows its level, the entry (link) and the field; a design check shows its level in strict mode
  - id: R2
    text: Issues can be filtered by level (errors, warnings, info) and to design checks only
tickets:
  - PRODUCTCREATOR-29
  - PRODUCTCREATOR-34
screens:
  - id: S1
    title: Problems of the catalog
    path: /problems
acceptance:
  - id: A1
    covers:
      - R1
    text: /api/validation returns each issue with entry, field, level, check and intended level, and the counts
    verify: pnpm --filter @pc/core test features
  - id: A2
    covers:
      - R2
    text: The Problems page has a level filter and a design-checks-only switch (screenshot catalog.problems.show S1)
    verify: pnpm catalog:spec
i18n:
  ru:
    name: Проблемы каталога
    description: Страница «Проблемы» показывает ошибки и предупреждения проверки со ссылками на записи.
    requirements:
      R1:
        text: У каждой проблемы видны уровень, запись (ссылка) и поле; у проверки проектирования — её уровень в strict-режиме
      R2:
        text: Проблемы фильтруются по уровню (ошибки, предупреждения, подсказки) и отдельно по проверкам проектирования
    acceptance:
      A1:
        text: /api/validation возвращает каждую проблему с записью, полем, уровнем, проверкой и уровнем в strict, а также счётчики
      A2:
        text: На странице «Проблемы» есть фильтр уровня и переключатель «только проверки проектирования» (скриншот catalog.problems.show S1)
    screens:
      S1:
        title: Проблемы каталога
