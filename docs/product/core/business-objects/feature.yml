id: feature
name: Feature
owner: atai
lifecycle: implemented
description: 'A business capability: features/<context>/<entity>.<action>.yml'
active: true
fields:
  - name: id
    type: string
    description: <bounded_context>.<entity>.<action>
  - name: name
    type: string
  - name: lifecycle
    type: enum<draft|approved|implemented|deprecated|removed>
  - name: description
    type: text?
  - name: calls
    type: feature[]
  - name: objects
    type: feature.object_ref[]
    description: With access read | write
  - name: source_file
    type: string?
  - name: actors
    type: string[]
  - name: requirements
    type: feature.requirement[]
  - name: acceptance
    type: feature.acceptance[]
  - name: constraints
    type: feature.constraint[]
  - name: decisions
    type: feature.decision[]
  - name: open_questions
    type: feature.question[]
  - name: code_refs
    type: feature.code_ref[]
    description: component, file, symbol, role
  - name: tickets
    type: string[]
  - name: screens
    type: feature.screen[]
    description: screenshots for the spec
tables: []
