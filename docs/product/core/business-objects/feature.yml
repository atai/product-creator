    type: string
    description: <bounded_context>.<entity>.<action>
  - name: name
    type: string
  - name: lifecycle
    type: enum<draft|approved|implemented|deprecated|removed>
  - name: description
    type: text?
  - name: calls
    type: feature[]
  - name: objects
    type: business_object[]
    description: With access read | write
  - name: source_file
    type: string?
  - name: actors
    type: string[]
  - name: requirements
    type: json
  - name: acceptance
    type: json
  - name: constraints
    type: json
  - name: decisions
    type: json
  - name: open_questions
    type: json
  - name: code_refs
    type: json
    description: component, file, symbol, role
  - name: tickets
    type: string[]
