id: interfaces.openapi.generate
name: Generate OpenAPI specs
bounded_context: interfaces
entity: openapi
action: generate
owner: atai
lifecycle: implemented
tags: []
emits: []
consumes: []
apis: []
description: Runs the OpenAPI generate command of a component and reloads its operations.
source_file: interfaces/generator.ts
objects:
  - id: component
    access: read
requirements:
  - id: R1
    text: The command runs in the component folder with the login shell PATH
  - id: R2
    text: One generation per component at a time; it can be cancelled
acceptance:
  - id: A1
    covers:
      - R2
    text: The manager runs, deduplicates and cancels generations
    verify: pnpm --filter @pc/core test generator
  - id: A2
    covers:
      - R1
    text: Commands run in their folder with node_modules/.bin and the login shell PATH
    verify: pnpm --filter @pc/core test process
tickets:
  - PRODUCTCREATOR-23
