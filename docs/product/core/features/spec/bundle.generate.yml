id: spec.bundle.generate
name: Generate the agent spec bundle
bounded_context: spec
entity: bundle
action: generate
owner: atai
lifecycle: implemented
tags: []
emits: []
consumes: []
apis: []
description: Manifest and small chunks per feature, component and interface group, with ids, contracts, objects, acceptance with verify and code anchors.
calls:
  - validation.model.validate
actors:
  - ai_agent
requirements:
  - id: R1
    text: Unresolved validation issues are part of the bundle next to the affected feature
  - id: R2
    text: 'Fields marked x-audience: human are left out'
tickets:
  - PRODUCTCREATOR-35
source_file: spec/agent.ts
decisions:
  - id: D1
    decision: 'One bundle per project: every live feature, object and workflow'
    reason: Answers Q1. Scoped bundles (component, release by tickets) are PRODUCTCREATOR-38
    date: '2026-11-28'
    status: accepted
  - id: D2
    decision: Chunk budget 16 KB; a larger chunk is flagged overBudget in the manifest
    reason: Answers Q2. An agent loads one chunk per task; the flag shows entries to split
    date: '2026-11-28'
    status: accepted
acceptance:
  - id: A1
    covers:
      - R1
      - R2
    text: The manifest lists entries with their issues; chunks carry agent fields only, with resolved objects
    verify: pnpm --filter @pc/core test spec
  - id: A2
    covers:
      - R1
    text: An agent reads the manifest and one chunk through MCP get_spec
    verify: pnpm --filter @pc/mcp test server
