# Product Creator project (https://github.com/atai/product-creator)
# Components live in <catalogRoot>/**/service.pc.yml and library.pc.yml. Edit in the app.
version: 2
id: 18a59566-5bc8-43ac-b24f-8ab132b8f0ec
slug: product-creator
name: Product Creator
description: Feature catalog and traceable product documentation (ТЗ) linked to code
docs: docs
catalogRoot: docs/product
vision: >-
  Product Creator keeps the logic of a product (features, data, workflows) as YAML next to the code, so people and AI
  agents plan it together, see planning errors before code is written, and get the spec (ТЗ) generated from the same
  model.
goals:
  - id: G1
    text: >-
      Planning and design errors are visible to people and agents as soon as they are written: in the editor, through
      MCP and in CI
  - id: G2
    text: Specs for people and for agents are generated from one model and never written twice
  - id: G3
    text: Every feature is traceable to its code, tickets and tests
  - id: G4
    text: Agents plan and change the catalog safely through MCP
actors:
  - id: product_owner
    name: Product owner
    description: Plans features, approves specs
  - id: developer
    name: Developer
    description: Builds features, links code, runs sync
  - id: ai_agent
    name: AI agent
    description: Reads and changes the catalog through MCP, locally or through the relay
  - id: ci
    name: CI
    description: Checks the catalog on every push
  - id: client
    name: Client
    description: Reads the human spec
glossary:
  - term: Feature
    definition: A business capability of the product (formerly function); one YAML file with its spec and links to code
  - term: Business object
    definition: A data entity of the product with typed fields
  - term: Workflow
    definition: An ordered sequence of features with compensations
  - term: Component
    definition: A service or library of a project; each has its own catalog folder
  - term: Catalog
    definition: The YAML files of features, business objects and workflows of a component
  - term: Lifecycle
    definition: draft → approved → implemented → deprecated → removed; each status has its own rules
  - term: Plan
    definition: A set of proposed catalog changes, checked as a whole before anything is written
  - term: Spec (ТЗ)
    definition: 'The document generated from the model: a human view and an agent bundle'
tracker:
  issueUrl: https://ecooz.youtrack.cloud/issue/{id}
screenshots:
  setup:
    - command: pnpm desktop:build
      timeoutSec: 300
  capture:
    command: node scripts/capture-screens.mjs
    timeoutSec: 300
  perLanguage: true
languages:
  - en
  - ru
i18n:
  ru:
    description: Каталог функций и прослеживаемая документация продукта (ТЗ), связанная с кодом
    vision: >-
      Product Creator хранит логику продукта (функции, данные, процессы) в YAML рядом с кодом, чтобы люди и ИИ-агенты
      планировали её вместе, видели ошибки планирования до написания кода и получали ТЗ из той же модели.
    goals:
      G1:
        text: >-
          Ошибки планирования и проектирования видны людям и агентам сразу, как только они записаны: в редакторе, через
          MCP и в CI
      G2:
        text: ТЗ для людей и для агентов строятся из одной модели и никогда не пишутся дважды
      G3:
        text: Каждая функция прослеживается до кода, задач и тестов
      G4:
        text: Агенты безопасно планируют и меняют каталог через MCP
    actors:
      product_owner:
        name: Владелец продукта
        description: Планирует функции, утверждает ТЗ
      developer:
        name: Разработчик
        description: Делает функции, связывает код, запускает синхронизацию
      ai_agent:
        name: ИИ-агент
        description: Читает и меняет каталог через MCP, локально или через релей
      ci:
        name: CI
        description: Проверяет каталог при каждом push
      client:
        name: Заказчик
        description: Читает ТЗ для людей
    glossary:
      Feature:
        definition: Бизнес-возможность продукта (раньше — function); один YAML-файл с её ТЗ и связями с кодом
      Business object:
        definition: Сущность данных продукта с типизированными полями
      Workflow:
        definition: Упорядоченная последовательность функций с компенсациями
      Component:
        definition: Сервис или библиотека проекта; у каждого своя папка каталога
      Catalog:
        definition: YAML-файлы функций, бизнес-объектов и процессов компонента
      Lifecycle:
        definition: draft → approved → implemented → deprecated → removed; у каждого статуса свои правила
      Plan:
        definition: Набор предлагаемых изменений каталога, который проверяется целиком до записи
      Spec (ТЗ):
        definition: 'Документ, построенный по модели: вид для людей и пакет для агентов'
