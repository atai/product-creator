### General ###
server.port=18085
spring.mustache.check-template-location=false
### SSL ###
# Always use SSL.
server.ssl.key-alias=selfsigned
server.ssl.key-store=file:local_temp/keystore.p12
server.ssl.key-store-password=changeit
server.ssl.enabled=true
### Logging ###
logging.level.org.atmosphere=warn
logging.level.web=debug
logging.level.ru.ecooz.finlife.webapp.security=debug
### DB ###
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:./product-creator-frontend;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=sa
# PostgreSQL configuration.
#spring.datasource.url = jdbc:postgresql://192.168.49.205:5432/vaadinstart
#spring.datasource.username = postgres
